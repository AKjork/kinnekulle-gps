<title>RailTimer – uppspelade resor</title>

  iframe { width: 390px; height: 844px; border: 1px solid #888; }

<body>
<h1>RailTimer – uppspelade resor</h1>
<p>Körs med <code>node tests/run-browser-tests.mjs</code>. Appen laddas i testläge (<code>?test=1</code>) och får simulerade GPS-positioner.</p>
<iframe id="app"></iframe>
<script>
'use strict';

// Kinnekullebanan Lidköping → Hällekis: namn, latitud, longitud, signatur
const STATIONS = [
  ['Lidköping', 58.50462, 13.1639339, 'Lkp'],
  ['Filsbäck', 58.4931843, 13.2469536, 'Fiä'],
  ['Källby', 58.5107931, 13.3023402, 'Kll'],
  ['Blomberg', 58.5402058, 13.3206466, 'Bmb'],
  ['Råbäck', 58.6105061, 13.376454, 'Rbk'],
  ['Hällekis', 58.6302156, 13.432943, 'Hlk']
];
const START = Date.UTC(2026, 9, 15, 5, 0, 0);
const STEP_MS = 2000;
const realSleep = ms => new Promise(r => setTimeout(r, ms));

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/* GPS-positioner var 2:a sekund för en hel resa. Tåget står vid start, accelererar till 20 m/s,
   bromsar in de sista 400 m och står 40 s vid varje station (dwellMs: avvikande uppehåll per stationsindex).
   opts.signalStop = { leg, frac, ms }: tåget står still ms millisekunder mitt på en sträcka, t.ex. vid en signal.
   Varje position: { t, lat, lon, speed, leg, frac, dwellAt, signal } där leg i går från station i till i+1. */
function buildJourney(dwellMs, opts) {
  const dwell = Object.assign({}, dwellMs);
  const signal = (opts && opts.signalStop) || null;
  const fixes = [];
  let t = START;
  const push = (lat, lon, speed, info) => { fixes.push(Object.assign({ t, lat, lon, speed }, info)); t += STEP_MS; };
  for (let i = 0; i < 3; i++) push(STATIONS[0][1], STATIONS[0][2], 0, { leg: -1, frac: 0, dwellAt: 0 });
  for (let leg = 0; leg < STATIONS.length - 1; leg++) {
    const A = STATIONS[leg], B = STATIONS[leg + 1];
    const L = haversine(A[1], A[2], B[1], B[2]);
    let signalDone = !signal || signal.leg !== leg;
    for (let s = 0; s < L; ) {
      const v = s < 200 ? 3 + 12 * s / 200 : (s < L - 400 ? 20 : Math.max(1.5, 20 * (L - s) / 400));
      const f = s / L;
      if (!signalDone && f >= signal.frac) {
        signalDone = true;
        for (let k = 0; k < signal.ms / STEP_MS; k++) {
          push(A[1] + (B[1] - A[1]) * f, A[2] + (B[2] - A[2]) * f, 0, { leg, frac: f, dwellAt: null, signal: true });
        }
      }
      push(A[1] + (B[1] - A[1]) * f, A[2] + (B[2] - A[2]) * f, v, { leg, frac: f, dwellAt: null });
      s += v * STEP_MS / 1000;
    }
    const isLast = leg + 1 === STATIONS.length - 1;
    const ms = isLast ? 10000 : (dwell[leg + 1] != null ? dwell[leg + 1] : 40000);
    for (let k = 0; k < ms / STEP_MS; k++) push(B[1], B[2], 0, { leg, frac: 1, dwellAt: leg + 1 });
  }
  return fixes;
}

async function loadApp() {
  const frame = document.getElementById('app');
  await new Promise(resolve => { frame.onload = resolve; frame.src = '../index.html?test=1&n=' + Date.now(); });
  const w = frame.contentWindow;
  for (let i = 0; i < 100 && !w.__railtimer; i++) await realSleep(20);
  if (!w.__railtimer) throw new Error('Appen startade inte i testläge');
  return w;
}

// Appen använder new Date() och Date.now(); i testerna styr vi klockan
function installClock(w, startMs) {
  const RealDate = w.Date;
  let now = startMs;
  class TestDate extends RealDate {
    constructor(...args) { if (args.length) super(...args); else super(now); }
    static now() { return now; }
  }
  w.Date = TestDate;
  return { set(t) { now = t; } };
}

async function clearAppStorage(w) {
  w.localStorage.clear();
  await new Promise(resolve => {
    const req = w.indexedDB.deleteDatabase('railtimer');
    req.onsuccess = req.onerror = req.onblocked = () => resolve();
  });
}

/* Spelar upp en resa. opts.drop(fix) → true tar bort positionen (avbrott).
   opts.reloadBefore: sidan laddas om (och resan återupptas) innan första position med t ≥ reloadBefore.
   opts.beforeStart(w): körs innan resan startar, t.ex. för att ställa in uppladdning. */
async function runJourney(fixes, opts) {
  const o = opts || {};
  let w = await loadApp();
  await clearAppStorage(w);
  if (o.beforeStart) await o.beforeStart(w);
  let clock = installClock(w, fixes[0].t - STEP_MS);
  let rt = w.__railtimer;
  const route = STATIONS.map((s, i) => rt.makeRouteStation({ name: s[0], lat: s[1], lon: s[2], sig: s[3], radius: 200 }, i));
  if (o.route) o.route(route);
  rt.initJourneyState(route, { trainNumber: o.trainNumber || 'TEST', vehicleType: 'Y31', notes: '' });
  rt.showView('journey');
  rt.renderRouteCards();
  if (o.afterStart) await o.afterStart(rt, w);
  const fed = [];
  let reloaded = false;
  for (const f of fixes) {
    if (o.drop && o.drop(f)) continue;
    if (o.reloadBefore && !reloaded && f.t >= o.reloadBefore) {
      reloaded = true;
      // Samtalet kommer: appen går till bakgrunden (spåret sparas, Task 6) och sidan laddas sedan om
      if (rt.onAppHidden) await rt.onAppHidden();
      const saved = rt.loadActiveJourney();
      w = await loadApp();
      clock = installClock(w, f.t);
      rt = w.__railtimer;
      await rt.resumeJourney(saved);
    }
    clock.set(f.t);
    rt.handlePosition({ coords: { latitude: f.lat, longitude: f.lon, accuracy: 5, speed: f.speed, heading: null }, timestamp: f.t });
    fed.push(f);
    await realSleep(0); // som i verkligheten: webbläsaren hinner arbeta (t.ex. spara i IndexedDB) mellan positionerna
    if (!rt.state.running) break;
  }
  await realSleep(150);
  const logs = rt.loadLogs();
  return { w, rt, log: logs[logs.length - 1], fed };
}

const pick = s => ({ name: s.name, actualArrival: s.actualArrival, actualDeparture: s.actualDeparture, arrivalSource: s.arrivalSource, departSource: s.departSource });
const summarize = log => log.stops.map(pick);
const stopOf = (log, name) => log.stops.find(s => s.name === name);
const iso = t => new Date(t).toISOString();

function assertEqual(actual, expected, label) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${label}: fick ${a}, väntade ${e}`);
}
function assert(cond, label) {
  if (!cond) throw new Error(label);
}
function sameAsControl(log, control, names) {
  for (const name of names) assertEqual(pick(stopOf(log, name)), pick(stopOf(control, name)), name);
}

const TESTS = [];
function test(name, fn) { TESTS.push({ name, fn }); }

async function golden() {
  const res = await fetch('golden-normal-run.json', { cache: 'no-store' });
  if (!res.ok) throw new Error('Facit saknas – kör: node tests/run-browser-tests.mjs --golden');
  return res.json();
}

// ── Task 1: regression ──

test('vanlig resa: alla stationer får tider', async () => {
  const r = await runJourney(buildJourney());
  const s = r.log.stops;
  assert(s[0].actualDeparture, 'avgång från start saknas');
  for (let i = 1; i < s.length - 1; i++) assert(s[i].actualArrival && s[i].actualDeparture, `tider saknas för ${s[i].name}`);
  assert(s[s.length - 1].actualArrival, 'ankomst till slutstationen saknas');
});

test('regression: vanlig resa ger exakt samma tider som facit', async () => {
  const r = await runJourney(buildJourney());
  assertEqual(summarize(r.log), await golden(), 'tider');
});

// ── GPS-brus vid start: falsk fart medan GPS:en låser in sig ──

test('start: några sekunders falsk fart vid startstationen ger ingen avgång', async () => {
  const base = buildJourney();
  // Efter de tre första stillastående positionerna: 6 s falsk fart (4–5 km/h) på samma plats,
  // sedan står tåget still 10 s till. Resten av resan förskjuts lika mycket.
  const S = STATIONS[0];
  const extra = [1.2, 1.4, 1.1, 0, 0, 0, 0, 0];
  const head = base.slice(0, 3);
  const inserted = extra.map((speed, k) => ({ t: head[2].t + (k + 1) * STEP_MS, lat: S[1], lon: S[2], speed, leg: -1, frac: 0, dwellAt: 0 }));
  const shift = extra.length * STEP_MS;
  const tail = base.slice(3).map(f => Object.assign({}, f, { t: f.t + shift }));
  const r = await runJourney(head.concat(inserted, tail));
  const firstMoving = tail.find(f => f.speed > 0.6).t;
  assertEqual(r.log.stops[0].actualDeparture, iso(firstMoving), 'avgång från start = första positionen i verklig rörelse');
  assert(r.log.stops[1].actualArrival, 'resan fortsatte till nästa station');
});

test('start: avgången räknas från när tåget började rulla, inte när den bekräftades', async () => {
  const r = await runJourney(buildJourney());
  const firstMoving = buildJourney().find(f => f.speed > 0.6).t;
  assertEqual(r.log.stops[0].actualDeparture, iso(firstMoving), 'avgång från start');
});

// ── Falsk avgång vid mellanstationer (granskning 2026-11-25) ──

// Första positionen i rörelse efter uppehållet vid stationen med index idx
function departureAfterDwell(fixes, idx) {
  let j = fixes.findIndex(f => f.dwellAt === idx);
  while (fixes[j].dwellAt === idx) j++;
  return fixes[j].t;
}
const withSpeed = (fixes, indices, speed) => fixes.map((f, i) => indices.includes(i) ? Object.assign({}, f, { speed }) : f);

test('avgång: en position utan fart under uppehållet ger ingen avgång', async () => {
  // Som Vedum 2026-11-24: en position utan fart under gång, och en till mitt i uppehållet.
  // Farten räknades förut mellan de två, och tåget verkade köra fast det stod still.
  const fixes = buildJourney();
  const control = await runJourney(fixes);
  const moving = fixes.findIndex(f => f.leg === 0 && f.speed === 20);
  const dwell = fixes.findIndex(f => f.dwellAt === 2) + 5;
  const r = await runJourney(withSpeed(fixes, [moving, dwell], null));
  assertEqual(stopOf(r.log, 'Källby').actualDeparture, iso(departureAfterDwell(fixes, 2)), 'avgång Källby');
  sameAsControl(r.log, control.log, STATIONS.map(s => s[0]));
});

test('avgång: en enstaka fartmätning på 2,3 km/h när tåget har stannat ger ingen avgång', async () => {
  // Som Hällekis 2026-11-02: 1,9 km/h, 1,8 km/h, 2,3 km/h och sedan stilla i 20 s
  const fixes = buildJourney();
  const control = await runJourney(fixes);
  const spike = fixes.findIndex(f => f.dwellAt === 2) + 3;
  const r = await runJourney(withSpeed(fixes, [spike], 0.65));
  assertEqual(stopOf(r.log, 'Källby').actualDeparture, iso(departureAfterDwell(fixes, 2)), 'avgång Källby');
  sameAsControl(r.log, control.log, STATIONS.map(s => s[0]));
});

test('avgång: telefon som aldrig anger fart – farten räknas ur positionerna', async () => {
  const fixes = buildJourney();
  const control = await runJourney(fixes);
  const r = await runJourney(fixes.map(f => Object.assign({}, f, { speed: null })));
  for (const [name] of STATIONS) {
    const a = stopOf(r.log, name), c = stopOf(control.log, name);
    for (const key of ['actualArrival', 'actualDeparture']) {
      if (!c[key]) continue;
      assert(a[key], `${name}: ${key} saknas`);
      const diff = Math.abs(Date.parse(a[key]) - Date.parse(c[key]));
      assert(diff <= 6000, `${name}: ${key} skiljer ${diff / 1000} s från kontrollen`);
    }
  }
});

// ── Full lagring (granskning 2026-11-25) ──

// Fyller localStorage så att nästan inget mer får plats (andra sidor på samma webbplats, år av mätningar)
function fillStorage(w) {
  let i = 0;
  for (const size of [256 * 1024, 16 * 1024, 1024, 64]) {
    const chunk = 'x'.repeat(size);
    try { for (;;) w.localStorage.setItem('fyll' + (i++), chunk); } catch (e) { /* fullt */ }
  }
}

test('lagring: full lagring – resan finns kvar för export och rapporten säger det', async () => {
  const r = await runJourney(buildJourney(), { afterStart: (rt, w) => fillStorage(w) });
  assertEqual(r.w.localStorage.getItem('kmon_gps_logs_v1'), null, 'resan får inte plats i lagringen');
  assertEqual(r.log && r.log.id, r.rt.state.journeyId, 'resan finns kvar i minnet');
  assert(r.log.stops[1].actualArrival, 'med tider');
  const report = r.w.document.getElementById('reportHTML').textContent;
  assert(/kunde inte sparas på telefonen/.test(report) && /Exportera JSON/.test(report), 'rapporten ska säga att resan inte sparades');
});

test('lagring: full lagring – äldre uppladdade körningar tas bort så att resan får plats', async () => {
  let fake;
  const old = Array.from({ length: 20 }, (_, i) => ({ id: 'gammal' + i, startedAt: new Date(START - (30 - i) * 86400000).toISOString(),
    trainNumber: '1', startStation: 'A', endStation: 'B', stops: [], notes: 'x'.repeat(20000) }));
  const r = await runJourney(buildJourney(), {
    beforeStart: async w => {
      fake = browserFakeGitHub(w);
      configureUpload(w, fake);
      w.localStorage.setItem('kmon_gps_logs_v1', JSON.stringify(old));
      w.localStorage.setItem('railtimer_upload_v1', JSON.stringify({ repo: 'AKjork/railtimer-data', uploadedIds: old.map(l => l.id), backlogDone: true }));
    },
    afterStart: (rt, w) => fillStorage(w)
  });
  await r.rt.whenUploadIdle();
  const stored = JSON.parse(r.w.localStorage.getItem('kmon_gps_logs_v1')).map(l => l.id);
  assert(stored.includes(r.log.id), 'resan ska vara sparad på telefonen');
  assert(!stored.includes('gammal0') && stored.includes('gammal19'), `de äldsta uppladdade tas bort först: ${stored.join(',')}`);
  assert(fake.files.get(r.w.RailTimerGitHub.runPath(r.log)), 'resan ska vara uppladdad');
  assert(/togs bort från telefonen/.test(r.w.document.getElementById('reportHTML').textContent), 'rapporten ska säga det');
});

test('lagring: full lagring utan uppladdning – inga körningar tas bort', async () => {
  const old = [{ id: 'gammal', startedAt: new Date(START - 86400000).toISOString(), trainNumber: '1', startStation: 'A', endStation: 'B', stops: [], notes: 'x'.repeat(20000) }];
  const r = await runJourney(buildJourney(), {
    beforeStart: async w => { w.localStorage.setItem('kmon_gps_logs_v1', JSON.stringify(old)); },
    afterStart: (rt, w) => fillStorage(w)
  });
  const stored = JSON.parse(r.w.localStorage.getItem('kmon_gps_logs_v1')).map(l => l.id);
  assertEqual(stored, ['gammal'], 'den sparade körningen finns kvar');
  assertEqual(r.rt.loadLogs().map(l => l.id), ['gammal', r.log.id], 'den nya finns i minnet');
});

// ── Task 3: körningsformat 2 ──

test('format 3: id, format, appversion och stationsfält', async () => {
  const r = await runJourney(buildJourney());
  const log = r.log;
  assertEqual(log.format, 3, 'format (3 sedan 2026-11-25f: tågorderns tider operationalArrival/-Departure)');
  assert(typeof log.appVersion === 'string' && log.appVersion.length > 0, 'appVersion saknas');
  assertEqual(log.id, r.rt.state.journeyId, 'id ska vara resans id');
  const s = log.stops[1];
  assertEqual([s.sig, s.lat, s.lon, s.radius], ['Fiä', STATIONS[1][1], STATIONS[1][2], 200], 'stationsfält');
  assertEqual(log.interruptions, [], 'avbrott');
});

// ── Task 4: avbrott ──

test('avbrott: samtal när tåget står i Källby', async () => {
  const fixes = buildJourney();
  const control = await runJourney(fixes);
  const arrK = Date.parse(stopOf(control.log, 'Källby').actualArrival);
  const tResume = fixes.find(f => f.leg === 2 && f.frac >= 0.66).t;
  const r = await runJourney(fixes, { drop: f => f.t > arrK + 10000 && f.t < tResume });
  const lastBefore = Math.max(...fixes.filter(f => f.t <= arrK + 10000).map(f => f.t));
  const k = stopOf(r.log, 'Källby');
  assertEqual(k.actualArrival, stopOf(control.log, 'Källby').actualArrival, 'ankomst Källby');
  assertEqual(k.actualDeparture, null, 'avgång Källby');
  assertEqual(k.departSource, 'avbrott', 'källa för avgång');
  assertEqual(k.departureWindow, { from: iso(lastBefore), to: iso(tResume) }, 'fönster');
  sameAsControl(r.log, control.log, ['Lidköping', 'Filsbäck', 'Blomberg', 'Råbäck', 'Hällekis']);
  assertEqual(r.log.interruptions.length, 1, 'antal avbrott');
});

function twoStationCall(fixes) {
  const from = fixes.find(f => f.leg === 1 && f.frac >= 0.5).t;     // mitt mellan Filsbäck och Källby
  const resume = fixes.find(f => f.leg === 3 && f.frac >= 0.5).t;   // mitt mellan Blomberg och Råbäck
  return { from, resume, drop: f => f.t >= from && f.t < resume };
}

function assertTwoStationCall(r, control) {
  for (const name of ['Källby', 'Blomberg']) {
    const s = stopOf(r.log, name);
    assertEqual([s.missedReason, s.actualArrival, s.actualDeparture], ['avbrott', null, null], name);
  }
  sameAsControl(r.log, control.log, ['Lidköping', 'Filsbäck', 'Råbäck', 'Hällekis']);
  assertEqual(r.log.interruptions.length, 1, 'antal avbrott');
}

test('avbrott: samtal medan två stationer passeras – appen kommer ikapp', async () => {
  const fixes = buildJourney();
  const control = await runJourney(fixes);
  const call = twoStationCall(fixes);
  const r = await runJourney(fixes, { drop: call.drop });
  assertTwoStationCall(r, control);
});

test('avbrott: 60 s utan positioner medan tåget står still är inget avbrott', async () => {
  const fixes = buildJourney({ 3: 100000 });
  const control = await runJourney(fixes);
  const dwellStart = fixes.find(f => f.dwellAt === 3).t;
  const r = await runJourney(fixes, { drop: f => f.t > dwellStart + 20000 && f.t <= dwellStart + 80000 });
  sameAsControl(r.log, control.log, STATIONS.map(s => s[0]));
  assertEqual(r.log.interruptions.length, 0, 'antal avbrott');
});

test('avbrott: 30 s glapp mellan stationer tar inte bort några tider', async () => {
  const fixes = buildJourney();
  const control = await runJourney(fixes);
  const from = fixes.find(f => f.leg === 3 && f.frac >= 0.3).t;
  const r = await runJourney(fixes, { drop: f => f.t >= from && f.t < from + 30000 });
  sameAsControl(r.log, control.log, STATIONS.map(s => s[0]));
  assertEqual(r.log.interruptions.length, 1, 'antal avbrott');
});

test('avbrott: samtal när tåget kommer fram till slutstationen', async () => {
  const fixes = buildJourney();
  const control = await runJourney(fixes);
  const from = fixes.find(f => f.leg === 4 && f.frac >= 0.8).t;   // sista biten mot Hällekis
  const r = await runJourney(fixes, { drop: f => f.t >= from && f.dwellAt == null });
  const h = stopOf(r.log, 'Hällekis');
  assertEqual(h.actualArrival, null, 'ankomst Hällekis');
  assertEqual(h.arrivalSource, 'avbrott', 'källa');
  assert(h.arrivalWindow && h.arrivalWindow.to, 'fönster saknas');
  assertEqual(r.rt.state.running, false, 'resan ska avslutas');
  sameAsControl(r.log, control.log, ['Lidköping', 'Filsbäck', 'Källby', 'Blomberg', 'Råbäck']);
});

test('avbrott: sidan laddas om under samtalet och resan återupptas', async () => {
  const fixes = buildJourney();
  const control = await runJourney(fixes);
  const call = twoStationCall(fixes);
  const r = await runJourney(fixes, { drop: call.drop, reloadBefore: call.resume });
  assertTwoStationCall(r, control);
});

test('avbrott: avgång under samtalet och tåget står vid en signal när samtalet slutar', async () => {
  const fixes = buildJourney(null, { signalStop: { leg: 2, frac: 0.5, ms: 60000 } }); // signal mitt mellan Källby och Blomberg
  const control = await runJourney(fixes);
  const arrK = Date.parse(stopOf(control.log, 'Källby').actualArrival);
  const resume = fixes.find(f => f.signal).t + 20000; // samtalet slutar 20 s in i stoppet vid signalen
  const r = await runJourney(fixes, { drop: f => f.t > arrK + 10000 && f.t < resume });
  const lastBefore = Math.max(...fixes.filter(f => f.t <= arrK + 10000).map(f => f.t));
  const k = stopOf(r.log, 'Källby');
  assertEqual(k.actualArrival, stopOf(control.log, 'Källby').actualArrival, 'ankomst Källby');
  assertEqual([k.actualDeparture, k.departSource], [null, 'avbrott'], 'avgång Källby');
  assertEqual(k.departureWindow, { from: iso(lastBefore), to: iso(resume) }, 'fönster');
  sameAsControl(r.log, control.log, ['Lidköping', 'Filsbäck', 'Blomberg', 'Råbäck', 'Hällekis']);
  assertEqual(r.log.interruptions.length, 1, 'antal avbrott');
});

test('avbrott: avgång under samtalet och tåget står redan vid nästa station när samtalet slutar', async () => {
  const fixes = buildJourney();
  const control = await runJourney(fixes);
  const arrK = Date.parse(stopOf(control.log, 'Källby').actualArrival);
  const resume = fixes.find(f => f.dwellAt === 3).t + 10000; // samtalet slutar 10 s in i uppehållet i Blomberg
  const r = await runJourney(fixes, { drop: f => f.t > arrK + 10000 && f.t < resume });
  const k = stopOf(r.log, 'Källby');
  assertEqual([k.actualDeparture, k.departSource], [null, 'avbrott'], 'avgång Källby');
  assertEqual(k.departureWindow && k.departureWindow.to, iso(resume), 'fönster för avgången');
  const b = stopOf(r.log, 'Blomberg');
  assertEqual([b.actualArrival, b.arrivalSource], [null, 'avbrott'], 'ankomst Blomberg');

// Ett minimalt simulerat GitHub i webbläsaren (samma svar som tests/fake-github.js)
function browserFakeGitHub(w, opts) {
  const o = opts || {};
  const files = new Map();
  const calls = [];
  let n = 0;
  const GH = w.RailTimerGitHub;
  const resp = (status, body) => ({ ok: status >= 200 && status < 300, status, headers: { get: () => null }, json: async () => body, text: async () => JSON.stringify(body) });
  async function fetch(url, init) {
    const method = ((init && init.method) || 'GET').toUpperCase();
    const p = new URL(url).pathname;
    calls.push({ method, path: p });
    if (o.offline) throw new TypeError('Failed to fetch');
    let m;
    if (method === 'GET' && /^\/repos\/[^/]+\/[^/]+$/.test(p)) return resp(200, { private: true, default_branch: 'main', full_name: 'AKjork/railtimer-data' });
    if ((m = p.match(/\/contents\/(.+)$/))) {
      const path = decodeURIComponent(m[1]);
      if (method === 'GET') { const f = files.get(path); return f ? resp(200, { sha: f.sha, content: GH.encodeBase64(f.text) }) : resp(404, { message: 'Not Found' }); }
      const body = JSON.parse(init.body);
      const f = files.get(path);
      if (f && body.sha !== f.sha) return resp(422, { message: 'sha' });
      const sha = 'sha' + (++n);
      files.set(path, { sha, text: GH.decodeBase64(body.content), message: body.message });
      return resp(f ? 200 : 201, { content: { sha } });
    }
    if (method === 'GET' && /\/git\/trees\//.test(p)) {
      return resp(200, { truncated: false, tree: Array.from(files, ([path, f]) => ({ path, sha: f.sha, type: 'blob', size: f.text.length })) });
    }
    if (method === 'GET' && (m = p.match(/\/git\/blobs\/(.+)$/))) {
      const f = Array.from(files.values()).find(x => x.sha === m[1]);
      return f ? resp(200, { content: GH.encodeBase64(f.text), encoding: 'base64' }) : resp(404, { message: 'Not Found' });
    }
    return resp(500, { message: 'okänt anrop' });
  }
  function put(path, text) { files.set(path, { sha: 'sha' + (++n), text }); }
  return { fetch, files, calls, put };
}

// Minuter efter midnatt den 15 oktober 2026 (torsdag, lokal tid) som ISO-tid
function atMin(min, day) { return new Date(new Date(2026, 9, day || 15).getTime() + Math.round(min * 60000)).toISOString(); }

function ttStop(name, o, day) {
  const t = v => (v == null ? null : atMin(v, day));
  return {
    name,
    actualArrival: t(o.arr), actualDeparture: t(o.dep),
    // sArr/sDep är tågorderns tider (från appversion 2026-11-25f); de annonserade sätts lika
    scheduledArrival: t(o.sArr), scheduledDeparture: t(o.sDep),
    operationalArrival: t(o.sArr), operationalDeparture: t(o.sDep),
    arrivalSource: o.arr != null ? 'gps' : '', departSource: o.dep != null ? 'gps' : '',
    shouldStop: true
  };
}

/* Lidköping → Blomberg med tidtabell 07:00, 07:03/07:04, 07:09/07:10, 07:13 (minuter efter start):
   Lidköping → Filsbäck tar 2–3 min för lång tid (snål), Filsbäck → Källby 4 min för kort tid (generös,
   väntan i Källby), Källby → Blomberg i tid. Tre morgonkörningar, en kvällskörning helt i tid och två
   körningar mitt på dagen i motsatt riktning utan tidtabell. */
function againstRuns() {
  const forward = (id, s, ab) => {
    const bArr = s + ab, bDep = bArr + 0.5, cArr = bDep + 1, cDep = s + 10, dArr = cDep + 3;
    return {
      id, trainNumber: '3344', vehicleType: 'Y31', startedAt: atMin(s), aborted: false, startStation: 'Lidköping', endStation: 'Blomberg',
      stops: [
        ttStop('Lidköping', { dep: s, sDep: s }),
        ttStop('Filsbäck', { arr: bArr, dep: bDep, sArr: s + 3, sDep: s + 4 }),
        ttStop('Källby', { arr: cArr, dep: cDep, sArr: s + 9, sDep: s + 10 }),
        ttStop('Blomberg', { arr: dArr, sArr: s + 13 })
      ]
    };
  };
  const onTime = (id, s) => ({
    id, trainNumber: '3344', vehicleType: 'Y31', startedAt: atMin(s), aborted: false, startStation: 'Lidköping', endStation: 'Blomberg',
    stops: [
      ttStop('Lidköping', { dep: s, sDep: s }),
      ttStop('Filsbäck', { arr: s + 3, dep: s + 4, sArr: s + 3, sDep: s + 4 }),
      ttStop('Källby', { arr: s + 9, dep: s + 10, sArr: s + 9, sDep: s + 10 }),
      ttStop('Blomberg', { arr: s + 13, sArr: s + 13 })
    ]
  });
  const reverse = (id, s) => ({
    id, trainNumber: '3355', vehicleType: 'Y31', startedAt: atMin(s), aborted: false, startStation: 'Blomberg', endStation: 'Lidköping',
    stops: [
      ttStop('Blomberg', { dep: s }),
      ttStop('Källby', { arr: s + 4, dep: s + 5 }),
      ttStop('Filsbäck', { arr: s + 10, dep: s + 11 }),
      ttStop('Lidköping', { arr: s + 16 })
    ]
  });
  return [forward('f1', 420, 5), forward('f2', 450, 5.5), forward('f3', 480, 6), onTime('k1', 1140), reverse('r1', 720), reverse('r2', 750)];
}

/* Lidköping → Filsbäck → Källby → Blomberg den 13–15 oktober. Tåg 3344 har 6 min Filsbäck → Källby och tåg 3346
   har 2 min; båda tar 4 min. 3344 kommer 2 min tidigt till Källby och tappar 2,5 min där den 15:e.
   Tåg 3355 (motsatt riktning) saknar tidtabell. */
function trainRuns() {
  const days = [13, 14, 15];
  const t3344 = days.map(day => {
    const s = 420;
    const kDep = day === 15 ? s + 13.5 : s + 11;
    return {
      id: '3344-' + day, trainNumber: '3344', vehicleType: 'Y31', startedAt: atMin(s, day), aborted: false,
      startStation: 'Lidköping', endStation: 'Blomberg',
      stops: [
        ttStop('Lidköping', { dep: s, sDep: s }, day),
        ttStop('Filsbäck', { arr: s + 3, dep: s + 4, sArr: s + 3, sDep: s + 4 }, day),
        ttStop('Källby', { arr: s + 8, dep: kDep, sArr: s + 10, sDep: s + 11 }, day),
        ttStop('Blomberg', { arr: kDep + 3, sArr: s + 14 }, day)
      ]
    };
  });
  const t3346 = days.map(day => {
    const s = 600;
    return {
      id: '3346-' + day, trainNumber: '3346', vehicleType: 'Y31', startedAt: atMin(s, day), aborted: false,
      startStation: 'Lidköping', endStation: 'Blomberg',
      stops: [
        ttStop('Lidköping', { dep: s, sDep: s }, day),
        ttStop('Filsbäck', { arr: s + 3, dep: s + 4, sArr: s + 3, sDep: s + 4 }, day),
        ttStop('Källby', { arr: s + 8, dep: s + 9, sArr: s + 6, sDep: s + 7 }, day),
        ttStop('Blomberg', { arr: s + 12, sArr: s + 10 }, day)
      ]
    };
  });
  const t3355 = [720, 750].map(s => ({
    id: '3355-' + s, trainNumber: '3355', vehicleType: 'Y31', startedAt: atMin(s), aborted: false,
    startStation: 'Blomberg', endStation: 'Lidköping',
    stops: [
      ttStop('Blomberg', { dep: s }), ttStop('Källby', { arr: s + 3, dep: s + 4 }),
      ttStop('Filsbäck', { arr: s + 8, dep: s + 9 }), ttStop('Lidköping', { arr: s + 12 })
    ]
  }));
  return t3344.concat(t3346, t3355);
}

// Spår 1 punkt/s rakt norrut från t0: segments [[sekunder, m/s], ...]
function testTrack(runId, t0, segments) {
  const points = [];
  let t = 0, d = 0;
  for (const [secs, v] of segments) for (let k = 0; k < secs; k++) { points.push([t * 1000, 58.5 + d / 111195, 13.1, 5, v, null, 0]); t++; d += v; }
  return { format: 1, runId, trainNumber: '3344', t0, fields: ['t_ms', 'lat', 'lon', 'acc_m', 'speed_ms', 'heading_deg', 'fixAge_ms'], points };
}

/* Broms och gas: körning rakt norrut med GPS-spår (1 punkt/s). Tåget står 20 s, gasar 0,4 m/s² till 20 m/s och
   bromsar 0,5 m/s² så att det står vid varje station (400 m inbromsning, 500 m gas), står 30 s. */
const BRAKE_LINE = [{ name: 'Lidköping', x: 0 }, { name: 'Filsbäck', x: 3000 }, { name: 'Källby', x: 6000 }, { name: 'Blomberg', x: 9000 }];
function brakeRun(id, day, reverse, part) {
  let stations = part ? BRAKE_LINE.filter(st => part.includes(st.name)) : BRAKE_LINE;
  if (reverse) stations = stations.slice().reverse();
  const t0 = new Date(2026, 9, day, 7, 0, 0);
  const sign = reverse ? -1 : 1;
  const times = stations.map(() => ({}));
  const points = [];
  const dt = 0.05;
  let t = 0, x = stations[0].x, v = 0, next = 1, standUntil = 20, out = 0, stopping = false;
  for (let guard = 0; guard < 200000 && next <= stations.length; guard++) {
    if (t >= out - 1e-9) { points.push([Math.round(t * 1000), 58.5 + x / 111195, 13.1, 4, Math.round(v * 100) / 100, null, 0]); out += 1; }
    if (t < standUntil) { t += dt; if (t >= standUntil && next < stations.length) times[next - 1].dep = standUntil; continue; }
    if (next >= stations.length) break;
    const remaining = Math.abs(stations[next].x - x);
    if (stopping || remaining <= v * v / 1 + 0.05) { stopping = true; v = Math.max(0, v - 0.5 * dt); } else v = Math.min(20, v + 0.4 * dt);
    x += sign * v * dt;
    t += dt;
    if (stopping && v === 0) {
      stopping = false;
      x = stations[next].x;
      times[next].arr = t;
      standUntil = next === stations.length - 1 ? t + 3 : t + 30;
      next++;
    }
  }
  const iso = sec => (sec == null ? null : new Date(t0.getTime() + sec * 1000).toISOString());
  const run = {
    id, trainNumber: '3344', vehicleType: 'Y31', startedAt: t0.toISOString(), aborted: false, format: 2,
    startStation: stations[0].name, endStation: stations[stations.length - 1].name,
    stops: stations.map((st, i) => ({ name: st.name, actualArrival: iso(times[i].arr), actualDeparture: iso(times[i].dep),
      arrivalSource: 'gps', departSource: 'gps', shouldStop: true, lat: 58.5 + st.x / 111195, lon: 13.1, radius: 200 }))
  };
  return { run, track: { format: 1, runId: id, trainNumber: '3344', t0: t0.toISOString(), fields: ['t_ms', 'lat', 'lon', 'acc_m', 'speed_ms', 'heading_deg', 'fixAge_ms'], points } };
}
function brakeRuns() {
  // b7 går bara Källby → Blomberg
  return [brakeRun('b1', 12), brakeRun('b2', 13), brakeRun('b3', 14), brakeRun('b4', 12, true), brakeRun('b5', 13, true), brakeRun('b6', 14, true),
    brakeRun('b7', 15, false, ['Källby', 'Blomberg'])];
}

const STATION_LIST = STATIONS.map(s => ({ name: s[0], lat: s[1], lon: s[2], sig: s[3] }));
const offlineFetch = () => Promise.reject(new TypeError('Failed to fetch'));
function stationsResponse() {
  const body = { RESPONSE: { RESULT: [{ TrainStation: STATION_LIST.concat([{ name: 'Mariestad', lat: 58.7071, lon: 13.8256, sig: 'Mst' }])
    .map(s => ({ AdvertisedLocationName: s.name, LocationSignature: s.sig, Geometry: { WGS84: `POINT (${s.lon} ${s.lat})` } })) }] } };
  return { ok: true, status: 200, json: async () => body };
}
async function appWithStations(ageDays, fetchFn) {
  const w = await loadApp();

  w.localStorage.setItem('kmon_all_stations_v1', JSON.stringify({ timestamp: Date.now() - ageDays * 86400000, stations: STATION_LIST }));
  const calls = [];
  w.fetch = (url, init) => { calls.push(url); return fetchFn(url, init); };
  await w.__railtimer.loadAllStations();
  return { w, rt: w.__railtimer, calls };
}

// TrainAnnouncement-svar: [signatur, aktivitet, lokal tid som [år, mån, dag, tim, min], avgångsdatum, tågorderns tid
// (LocationDateTimeOTN) som [år, mån, dag, tim, min] – valfri]
function announcements(rows) {
  const list = rows.map(([sig, act, t, otnDate, otn]) => Object.assign(
    { LocationSignature: sig, ActivityType: act, AdvertisedTimeAtLocation: new Date(...t).toISOString(), DepartureDateOTN: otnDate },
    otn ? { LocationDateTimeOTN: new Date(...otn).toISOString() } : {}));
  return { ok: true, status: 200, json: async () => ({ RESPONSE: { RESULT: [{ TrainAnnouncement: list }] } }) };
}

// Tåg 23349 2026-11-25 enligt tågordern: Vara ank 11:53 avg 11:54 (annonserad avgång 11:53), Vedum ank 12:00 avg 12:01
// (annonserad ankomst och avgång 12:01), Herrljunga ank 12:09
test('tidtabell: tågorderns tider (LocationDateTimeOTN) hämtas och sparas bredvid de annonserade', async () => {
  const w = await loadApp();

  const d = (h, m) => [2026, 10, 25, h, m];
  w.fetch = async (url, init) => { body = init.body; return announcements([
    ['Vaa', 'Ankomst', d(11, 53), '2026-11-25', d(11, 53)], ['Vaa', 'Avgang', d(11, 53), '2026-11-25', d(11, 54)],
    ['Ved', 'Ankomst', d(12, 1), '2026-11-25', d(12, 0)], ['Ved', 'Avgang', d(12, 1), '2026-11-25', d(12, 1)],
    ['Hrc', 'Ankomst', d(12, 9), '2026-11-25', d(12, 9)]
  ]); };
  const r = await w.__railtimer.fetchTimetable('23349', new Date(2026, 10, 25, 11, 50));
  assert(r.success, r.error);
  assert(body.includes('<INCLUDE>LocationDateTimeOTN</INCLUDE>'), 'frågan hämtar tågorderns tid');
  const t = (h, m) => new Date(2026, 10, 25, h, m).toISOString();
  assertEqual([r.timetable.Ved.arrival.toISOString(), r.timetable.Ved.operationalArrival.toISOString()], [t(12, 1), t(12, 0)], 'Vedum ankomst: annonserad och tågorder');
  assertEqual([r.timetable.Vaa.departure.toISOString(), r.timetable.Vaa.operationalDeparture.toISOString()], [t(11, 53), t(11, 54)], 'Vara avgång: annonserad och tågorder');
});

test('tidtabell: godtar Trafikverket inte LocationDateTimeOTN frågar appen igen utan den och får ändå tidtabellen', async () => {
  for (const kind of ['http400', 'error200']) {
    const w = await loadApp();
    const bodies = [];
    w.fetch = async (url, init) => {
      bodies.push(init.body);
      if (init.body.includes('LocationDateTimeOTN')) {
        const err = { RESPONSE: { RESULT: [{ ERROR: { SOURCE: 'Request', MESSAGE: 'Invalid query' } }] } };
        return { ok: kind === 'error200', status: kind === 'error200' ? 200 : 400, json: async () => err };
      }

/* Simulerat Overpass: ett spår mellan varje par av stationer som buktar ut åt sidan, så att
   vägen längs spåret skiljer sig tydligt från fågelvägen. offline: true ger nätfel. */
function fakeOverpass(opts) {
  const o = opts || {};
  const calls = [];
  async function fetch(url, init) {
    calls.push({ url, body: init && init.body });
    if (o.offline) throw new TypeError('Failed to fetch');
    const elements = [];
    for (let i = 0; i + 1 < STATIONS.length; i++) {
      const A = STATIONS[i], B = STATIONS[i + 1];
      const geometry = [], nodes = [];
      for (let k = 0; k <= 12; k++) {
        const f = k / 12, bulge = 0.006 * Math.sin(Math.PI * f);
        geometry.push({ lat: A[1] + (B[1] - A[1]) * f + bulge, lon: A[2] + (B[2] - A[2]) * f });
        nodes.push(k === 0 ? i : (k === 12 ? i + 1 : 1000 + i * 100 + k));
      }
      elements.push({ type: 'way', id: 500 + i, nodes, geometry, tags: { railway: 'rail' } });
    }
    return { ok: true, status: 200, json: async () => ({ elements }) };
  }
  return { fetch, calls };
}

// Schemalagda tider för testresan: tidtabellen ligger 2–3 minuter före tåget
function scheduleFor(fixes) {
  const firstAt = i => fixes.find(f => f.dwellAt === i).t;
  return route => route.forEach((st, i) => {
    const base = i === 0 ? fixes[0].t + 120000 : firstAt(i) - 150000;
    const m = Math.round(base / 60000) * 60000;
    if (i > 0) st.scheduledArrival = new Date(m).toISOString();
    if (i < route.length - 1) st.scheduledDeparture = new Date(m + (i === 0 ? 0 : 60000)).toISOString();
  });
}

// Mitt på sträckan Källby → Blomberg
async function midJourney(extra) {
  const fixes = buildJourney();
  const stopT = fixes.find(f => f.leg === 2 && f.frac > 0.55).t;
  return runJourney(fixes, Object.assign({ trainNumber: '3344', drop: f => f.t > stopT, route: scheduleFor(fixes) }, extra));
}

// ── Trafikverkets rapporterade tider (railtimer-trv.js) ──

/* Simulerat Trafikverket för en uppspelad resa: annonseringar för tåget TEST med "rapporterade" tider
   = verklig ankomst + 5 s och avgång − 3 s. opts.lastLate: slutstationen rapporteras först vid andra anropet.
   opts.offline: nätfel. Varje anrop sparas i calls. */
function fakeTrafikverket(fixes, opts) {
  const o = opts || {};
  const calls = [];
  const n = STATIONS.length;
  const firstMove = fixes.find(f => f.speed > 0.6).t;
  const arrivals = [], departures = [];
  for (let i = 1; i < n; i++) {
    const at = fixes.filter(f => f.dwellAt === i);
    arrivals[i] = at[0].t;
    if (i < n - 1) departures[i] = at[at.length - 1].t + STEP_MS;
  }
  departures[0] = firstMove;
  const iso = ms => new Date(ms).toISOString();
  const minute = ms => iso(Math.round(ms / 60000) * 60000);
  async function fetch(url, init) {
    calls.push(init.body);
    if (o.offline) throw new TypeError('Failed to fetch');
    if (!/OperationalTrainNumber" value="TEST"/.test(init.body)) return { ok: true, status: 200, json: async () => ({ RESPONSE: { RESULT: [{ TrainAnnouncement: [] }] } }) };
    const anns = [];
    STATIONS.forEach((st, i) => {
      if (i > 0) {
        const late = o.lastLate && i === n - 1 && calls.length === 1;
        anns.push({ LocationSignature: st[3], ActivityType: 'Ankomst', AdvertisedTimeAtLocation: minute(arrivals[i]), TimeAtLocationWithSeconds: late ? undefined : iso(arrivals[i] + 5000), TrackAtLocation: '1' });
      }
      if (i < n - 1) anns.push({ LocationSignature: st[3], ActivityType: 'Avgang', AdvertisedTimeAtLocation: minute(departures[i]), TimeAtLocationWithSeconds: iso(departures[i] - 3000), TrackAtLocation: '1', Operator: 'SJ', ProductInformation: [{ Description: 'Västtågen' }] });
    });
    return { ok: true, status: 200, json: async () => ({ RESPONSE: { RESULT: [{ TrainAnnouncement: anns }] } }) };
  }
  return { fetch, calls, arrivals, departures };
}

async function loadApiKoll(setup) {
  const frame = document.getElementById('app');
  await new Promise(resolve => { frame.onload = resolve; frame.src = '../api-koll.html?test=1&n=' + Date.now(); });
  let w = frame.contentWindow;
  w.localStorage.clear();
  if (setup) setup(w);
  await new Promise(resolve => { frame.onload = resolve; frame.src = '../api-koll.html?test=1&n=' + Date.now(); });
  w = frame.contentWindow;
  for (let i = 0; i < 100 && !w.__apikoll; i++) await realSleep(20);
  if (!w.__apikoll) throw new Error('Kontrollsidan startade inte i testläge');
  return w;
}

function fakeTrafikverketApi() {
  const types = [];
  const today = new Date().toISOString().slice(0, 10);
  const day = '2026-11-24';
  const a = (sig, type, adv, rep, extra) => Object.assign({ LocationSignature: sig, ActivityType: type, Advertised: true, AdvertisedTimeAtLocation: `${day}T${adv}:00.000+01:00`, TimeAtLocationWithSeconds: rep ? `${day}T${rep}.000+01:00` : undefined }, extra || {});
  const anns = [
    a('Hrc', 'Avgang', '19:40', '19:40:12', { TrackAtLocation: '3', Operator: 'SJ', ProductInformation: [{ Description: 'Västtågen' }], FromLocation: [{ LocationName: 'Hrc' }], ToLocation: [{ LocationName: 'Mst' }] }),
    a('Ved', 'Ankomst', '19:47', '19:47:20'),
    a('Ved', 'Avgang', '19:48', '19:47:55', { LocationDateTimeOTN: `${day}T19:47:30.000+01:00` }),
    a('Grh', 'Avgang', '19:51', '19:51:40', { Advertised: false }),
    a('Vaa', 'Ankomst', '19:55', null, { Canceled: true, Deviation: [{ Description: 'Inställt' }] })
  ];
  async function fetch(url, init) {
    const type = /objecttype="([^"]+)"/.exec(init.body)[1];
    types.push(type);
    const data = {
      TrainAnnouncement: anns,
      TrainPosition: /<EQ name="Train.OperationalTrainNumber"/.test(init.body) ? [] : [{ Train: { OperationalTrainNumber: '24360' }, TimeStamp: new Date().toISOString(), Speed: 70 }],
      TrainStation: /<IN /.test(init.body) ? [{ LocationSignature: 'Ved', AdvertisedLocationName: 'Vedum', PlatformLine: ['1'] }] : [{ LocationSignature: 'Ved', Advertised: true }, { LocationSignature: 'Grh', Advertised: false, Geometry: { WGS84: 'POINT (13 58.2)' } }],
      TrainMessage: [{ Header: 'Banarbete Vara', StartDateTime: `${day}T08:00:00.000+01:00`, TrafficImpact: [{ AffectedLocation: [{ LocationSignature: 'Vaa' }] }] }],
      TrainStationMessage: [],
      ReasonCode: [{ Code: 'ANA002', Level1Description: 'Inställt' }]
    }[type];
    return { ok: true, status: 200, json: async () => ({ RESPONSE: { RESULT: [{ [type]: data }] } }) };
  }
  return { fetch, types, today };
}

window.prepareShot = async function (name) {
  if (name === 'installningar') {
    const w = await loadApp();

    w.localStorage.setItem('railtimer_github_v1', JSON.stringify({ repo: 'AKjork/railtimer-data', token: 'x', branch: 'main' }));
    w.localStorage.setItem('railtimer_upload_v1', JSON.stringify({ repo: 'AKjork/railtimer-data', uploadedIds: ['a', 'b', 'c'], backlogDone: true, uploadedTrackCount: 2, lastSuccessAt: '2026-10-15T06:10:00.000Z' }));
    w.__railtimer.showUploadSettings();
  } else if (name === 'avbrott') {
    const fixes = buildJourney();
    const call = twoStationCall(fixes);
    await runJourney(fixes, { drop: f => call.drop(f) || f.t > call.resume + 60000 });
  } else if (name === 'resa' || name === 'resa-vid-station' || name === 'resa-liggande') {
    // Mitt i en resa med tidtabell: på väg mot Blomberg (eller stående i Källby)
    const frame = document.getElementById('app');

    const stopT = name === 'resa-vid-station' ? fixes.find(f => f.dwellAt === 2).t + 20000 : fixes.find(f => f.leg === 2 && f.frac > 0.55).t;
    const ov = fakeOverpass();
    await runJourney(fixes, {
      trainNumber: '3344',
      drop: f => f.t > stopT,
      route: scheduleFor(fixes),
      afterStart: async rt => { rt.setRailFetchForTest(ov.fetch); await rt.loadRailGeometry(); }

    const fixes = buildJourney();
    await runJourney(fixes, { drop: twoStationCall(fixes).drop });
  } else if (name === 'rapport-trafikverket') {
    const fixes = buildJourney();
    const trv = fakeTrafikverket(fixes);
    const r = await runJourney(fixes, { trainNumber: 'TEST', route: scheduleFor(fixes), beforeStart: async w => w.__railtimer.setTrvFetchForTest(trv.fetch, 20) });

      win.localStorage.setItem('railtimer_github_v1', JSON.stringify({ repo: 'AKjork/railtimer-data', token: 'x', branch: 'main' }));
    });
    w.document.getElementById('date').value = '2026-11-24';

    frame.style.height = '1500px';

  window.scrollTo(0, 0); // appen kan ha scrollat även testsidan (scrollIntoView)
  const r = document.getElementById('app').getBoundingClientRect();
  return { x: r.x + window.scrollX, y: r.y + window.scrollY, width: r.width, height: r.height };
};

window.runTests = async function (filter) {
  const results = [];
  for (const t of TESTS) {
    if (filter && !t.name.includes(filter)) continue;
    try {
      await t.fn();
      results.push({ name: t.name, ok: true });
    } catch (e) {
      results.push({ name: t.name, ok: false, error: String(e && e.message || e) });
    }
  }
  return { results, passed: results.filter(r => r.ok).length, failed: results.filter(r => !r.ok).length };
};
